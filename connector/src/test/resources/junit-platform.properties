# Global switch JUnit 5 requires before ANY @Execution(CONCURRENT) class-level
# annotation takes effect — but the DEFAULT mode stays same_thread, so every
# class that doesn't explicitly opt in (the large majority: each already gets
# its own Gradle-forked JVM via forkEvery=1, so there's nothing to gain and no
# reason to introduce concurrent-method risk there) is completely unaffected.
# Only classes annotated @Execution(ExecutionMode.CONCURRENT) — currently
# VgiSqlLogicTestConformanceTest, whose ~15-20 @Test methods each just read a
# curated .test file and run it against one shared, already-attached,
# read-only SparkSession/worker with no mutable state shared across methods —
# actually run their methods concurrently.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=2
