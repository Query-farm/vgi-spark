# Copyright 2026 Query Farm LLC - https://query.farm
#
# Compiles and runs this connector's own full test suite (~76 tests,
# including the real sqllogictest sweep against `~/Development/vgi`'s
# corpus) against a live `vgi-rust` worker. No registry publish — see
# CLAUDE.md's own "State of play" note on why this connector doesn't have
# one (no natural artifact-registry story for a Spark connector jar the way
# there is for a library).
#
# vgi-java and vgi-rpc-java are built from source here, matching this
# repo's own settings.gradle.kts default (composite-include if the sibling
# directory is present, else fall back to the published farm.query:vgi
# Maven Central artifact) — vgi-spark tracks client-side vgi-java/
# vgi-rpc-java additions that may not be released yet (see
# settings.gradle.kts's own comment), so CI needs the same from-source build
# local development uses, not the possibly-stale published artifact.
#
# VGI_JAVA_REF/VGI_RPC_JAVA_REF are pinned to a specific SHA, not `main` —
# a floating ref there is exactly what vgi-java's own ci.yml/integration.yml
# comments warn broke things before (these two are actual library
# dependencies vgi-spark compiles against, so an unreviewed upstream change
# can break the build with no vgi-spark change of its own). Bump them
# deliberately, in the same PR as whatever vgi-spark change actually needs
# the newer commit, not as a routine "keep up to date" churn. VGI_REF/
# VGI_RUST_REF are kept floating on `main` on purpose (see each one's own
# comment below) — always run against their current tip.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the exact commits this connector was developed and verified
  # against (see CLAUDE.md's own canonical-references section for why these
  # two repos are composite-included rather than resolved from Maven
  # Central). Bump alongside a real vgi-spark change that needs the newer
  # commit, not routinely.
  VGI_JAVA_REF: 796de7bd9539f246d14e9c0a07354202145cdc7d
  VGI_RPC_JAVA_REF: 00b1d1f43f19cda7d734047aae18380e1b2aa286
  # The DuckDB reference client repo — only its test/sql/integration/*.test
  # corpus is used here (the sqllogictest conformance suite and full-corpus
  # sweep both just read these as plain text), never built. Deliberately
  # kept floating on `main`, unlike VGI_JAVA_REF/VGI_RPC_JAVA_REF above:
  # always sweep against the corpus's current tip.
  VGI_REF: main
  # The Rust worker this connector's own test suite runs against (see
  # CLAUDE.md's "Test worker: vgi-rust, not vgi-python") — deliberately kept
  # floating on `main`, unlike the other three refs above: always build
  # against vgi-rust's current tip.
  VGI_RUST_REF: main

jobs:
  test:
    name: Connector test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vgi-spark
        uses: actions/checkout@v4
        with:
          path: vgi-spark

      - name: Checkout pinned vgi-java
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-java
          ref: ${{ env.VGI_JAVA_REF }}
          path: vgi-java

      - name: Checkout pinned vgi-rpc-java
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-java
          ref: ${{ env.VGI_RPC_JAVA_REF }}
          path: vgi-rpc-java

      - name: Checkout vgi-rust (main)
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rust
          ref: ${{ env.VGI_RUST_REF }}
          path: vgi-rust

      # Sparse: only the sqllogictest corpus is needed, never a C++ build.
      - name: Checkout vgi (main, sqllogictest corpus only)
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi
          sparse-checkout: |
            test/sql/integration
          sparse-checkout-cone-mode: false

      # vgi-java/vgi-rpc-java's composite-build wiring is redirected via the
      # VGI_JAVA_DIR/VGI_RPC_JAVA_DIR env overrides below (see
      # settings.gradle.kts) rather than relying on the ~/Development/vgi-spark
      # + ~/vgi-java + ~/Development/vgi-rpc-java relative layout local
      # development uses — that layout assumes vgi-spark itself sits directly
      # under $HOME/Development, which isn't how actions/checkout lays things
      # out here. vgi-rust and vgi have no such override (vgi-spark's own
      # test code hardcodes ~/Development/<repo> via System.getProperty
      # ("user.home") — see CLAUDE.md), so those two genuinely need moving.
      - name: Lay out vgi-rust/vgi where vgi-spark's own test code expects them
        run: |
          mkdir -p "$HOME/Development"
          mv vgi-rust "$HOME/Development/vgi-rust"
          mv vgi "$HOME/Development/vgi"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '/home/runner/Development/vgi-rust -> target'

      - name: Build vgi-example-worker
        run: cd "$HOME/Development/vgi-rust" && cargo build --release --bin vgi-example-worker
        shell: bash

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('vgi-spark/**/*.gradle*', 'vgi-spark/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Full test suite
        run: ./gradlew --no-daemon build
        working-directory: vgi-spark
        env:
          VGI_JAVA_DIR: ${{ github.workspace }}/vgi-java
          VGI_RPC_JAVA_DIR: ${{ github.workspace }}/vgi-rpc-java

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: vgi-spark/connector/build/reports/tests/test
